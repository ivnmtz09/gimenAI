; PlatformIO Project Configuration File for GimenAI
; ESP32-S3-DevKitC-1 N8R8 (8MB Flash, 8MB PSRAM Octal)

[platformio]
default_envs = esp32-s3-n8r8
src_dir = src
include_dir = include

[env:esp32-s3-n8r8]
platform = espressif32 @ ^6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; Velocidad de comunicación serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Configuración de hardware para N8R8 (8MB Flash QIO, 8MB PSRAM OPI)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Habilitar soporte PSRAM Octal en el compilador
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Dependencias de librerías
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    madhephaestus/ESP32Servo @ ^3.0.5
    lovyan03/LovyanGFX @ ^1.1.16
