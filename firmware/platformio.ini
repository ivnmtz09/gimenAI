; PlatformIO Project Configuration File for GimenAI
; Configurado con 2 entornos:
; 1) esp32-test-devkit: Para pruebas inmediatas con ESP32 DevKit V1 (Type-C) + Pantalla OLED GM009605 (SSD1306) + Control IoT
; 2) esp32-s3-n8r8: Para la fase final con ESP32-S3 N8R8 + I2S Audio + ST7789 TFT + Servos

[platformio]
default_envs = esp32-test-devkit
src_dir = src
include_dir = include

; ==============================================================================
; ENTORNO DE TEST ACTUAL: ESP32 DEVKIT V1 TYPE-C + OLED GM009605 + CHAT IOT
; ==============================================================================
[env:esp32-test-devkit]
platform = espressif32 @ 7.1.0
board = esp32doit-devkit-v1
framework = arduino
; WiFi + Bluetooth A2DP necesitan una partición de aplicación mayor a 1,3 MB.
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

build_src_filter = +<test_mode/*>

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1
    ; Compatible con Arduino ESP32 2.0.17 (ESP-IDF 4.4).
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7

; ==============================================================================
; ENTORNO FINAL DE ROBÓTICA: ESP32-S3 N8R8 (8MB PSRAM + I2S + ST7789 + SERVOS)
; ==============================================================================
[env:esp32-s3-n8r8]
platform = espressif32 @ ^6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_src_filter = +<robot_final/*>

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    madhephaestus/ESP32Servo @ ^3.0.5
    lovyan03/LovyanGFX @ ^1.1.16
